<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #wrap{
            width: 1200px;
            margin: 0 auto;
        }
        #header{
            width: 1200px;
           display: flex;
         
        }
        #header .logo{
            width: 20%;
            height: 100px;
            background-color: #644f4f;
        }
        #header .nav{
            width: 80%;
            height: 100px;
            background-color: #f3eded;
        }

        
        #slider{
            width: 1200px;
            height: 300px;
            background-color: #522d2d;
        }
        #contents{
            width: 1200px;
            height: 200px;
            display: flex;
        }
        #contents .contents1{
            width: 33.3333%;
            height: 200px;
            background-color: #d1d1d1;
        }
        #contents .contents2{
            width: 33.3333%;
            height: 200px;
            background-color: #c7c7c7;
        }
        #contents .contents3{
            width: 33.3333%;
            height: 200px;
            background-color: #bcbcbc;
        }
        #footer{
            width: 1200px;
            height: 100px;
            display: flex;
        }
        #footer .footer1{
            width: 20%;
            height: 100px;
            background-color: #b1b1b1;
        }
        #footer .footer2{
            width: 60%;
            height: 100px;
            background-color: #a3a3a3;
        }
        #footer .footer3{
            width: 20%;
            height: 100px;
            background-color: #9d9d9d;
           
        }
    </style>
</head> 
<body>
    <div id="wrap">
        <div id="header">
            <div class="logo"></div>
            <div class="nav"></div>
        </div>
        <!-- //header-->
        <div id="slider"></div>
        <!-- //slider-->
        <div id="contents">
            <div class="contents1"></div>
            <div class="contents2"></div>
            <div class="contents3"></div>
        </div>
        <!-- //contents-->

        <div id="footer">
            <div class="footer1"></div>
            <div class="footer2"></div>
            <div class="footer3"></div>
        </div>
        
    </div>
</body>
</html>
