<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        #wrap{
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }
        #aside{
            width: 200px;
            height: 850px;
            background-color: #ccc;
        }
        #main{
            width: calc(100% - 200px);
            height: 850px;
            background-color: #cfc5c5;
        }
        #slider{
            width: 100%;
            height: 400px;
            background-color: #d9d9d9;
        
        }
        #slider .link{
            position: absolute;
            right: 0;
            top: 0;
            width: 100px;
            height: 300px;
            background-color: #9d9d9d;


        }
        #footer{
            width: 100%;
            height: 100px;
            background-color: #a32121;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </aside>
        <main id="main">
            <article id="slider">
                <div class="link"></div>
            </article>
            <article id="banner"></article>
            <section id="contents"></section>
        </main>
        <footer id="footer"></footer>
    </div>
    
</body>
</html>
